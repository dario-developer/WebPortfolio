<!DOCTYPE html>

        <header class="container pf-heading d-flex justify-content-between align-items-center mt-2 p-4 rounded-4">

            <!-- Columna izquierda -->

                    <img class="w-100" src="https://picsum.photos/400" alt="Imagen de mejores proyectos">

                    <img class="w-100" src="https://picsum.photos/400" alt="Imagen de mejores proyectos">

                <article class="pf-card">

                    <p class="pf-card-text">CV</p>

        <!-- LIBRERÍAS -->
